<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexa AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:14px;background:#12121a;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.bubble{padding:12px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap}
.me{align-self:flex-end;background:#6c5cff}.bot{align-self:flex-start;background:#1e1e2e}
.bar{display:flex;padding:10px;background:#12121a;border-top:1px solid #222;gap:8px}
#input{flex:1;padding:14px 18px;border-radius:25px;border:none;background:#1e1e2e;color:#fff;outline:none}
#send{width:44px;height:44px;border-radius:50%;border:none;background:#00ff88;font-weight:800}
</style>
</head>
<body>
<header><b>Nexa ⚡</b><button onclick="location.reload()" style="background:#222;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:20px">New Chat</button></header>
<div id="chat"></div>
<div class="bar"><input id="input" placeholder="Ketik..."><button id="send">➤</button></div>

<script>
const chatEl=document.getElementById('chat'), input=document.getElementById('input'), send=document.getElementById('send');
let history=[];
function add(t,r){let d=document.createElement('div');d.className='bubble '+r;d.innerText=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
add("Yo! Nexa online. Coba chat 'nice'","bot");

async function kirim(){
  let teks=input.value.trim(); if(!teks) return;
  add(teks,'me'); history.push({role:'me', text:teks});
  input.value=""; send.disabled=true;
  let load=add("...","bot");
  try{
    let mem=history.map(h=>(h.role==='me'?'User':'Kamu')+": "+h.text).join("\n");
    let finalPrompt=`Kamu Nexa, temen santai 20th, gaul Indonesia, ramah chill. Kalau user bilang nice jawab persis 'yoi thanks bro'. Memory: ${mem}\nUser: ${teks}`;

    // INI YANG BENER, PAKE /api/chat BUKAN LANGSUNG KE GOOGLE
    let res=await fetch(`/api/chat`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:finalPrompt}]}]})
    });
    let data=await res.json();
    load.remove();
    let j=data.candidates?.[0]?.content?.parts?.[0]?.text || "Error: "+JSON.stringify(data);
    add(j,'bot'); history.push({role:'bot', text:j});
  }catch(e){load.remove(); add("Error: "+e.message,"bot");}
  send.disabled=false;
}
send.onclick=kirim; input.onkeydown=e=>{if(e.key==='Enter') kirim();}
</script>
</body>
</html>
